site_name: The ATHENA Project
site_url: https://docs.astralabs.dev/
repo_url: https://github.com/emilyastranova/docs.astralabs.dev
repo_name: docs.astralabs.dev
site_description: A Technical Handbook of Essential Niche Advice
site_author: Emily Astranova
copyright: Copyright &copy; 2026 Emily Astranova
remote_branch: main
edit_uri: 'edit/main/docs/'

nav:
    - Home: index.md
    - Docker: docker.md
    - Linux: linux.md
    - Git: git.md
    - Python: python.md
    - CTF/Hacking: ctf-hacking.md
    - Cybersecurity: cybersecurity.md
    - Networking: networking.md
    - Self Hosting:
        - self-hosting/index.md
        - Hosting Services: self-hosting/hosting.md
        - Proxmox: self-hosting/proxmox.md
        - Reverse Proxy: self-hosting/reverse-proxy.md
        - Home Assistant: self-hosting/home-assistant.md
        - Plex: self-hosting/plex.md
        - Pi-hole: self-hosting/pi-hole.md
        - WireGuard: self-hosting/wireguard.md
    - Cheatsheets:
        - cheatsheets/index.md
        - Proxmox: cheatsheets/proxmox.md
    - Miscellaneous: misc.md

theme:
    name: material
    logo: assets/images/astralabs-mark.svg
    icon:
        repo: fontawesome/brands/github
    favicon: assets/images/favicon.png
    # Archivo and Martian Mono load from assets/stylesheets/extra.css (full width and weight axes)
    font: false
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.tabs
        - navigation.indexes
        - navigation.top
        - toc.integrate
        - toc.follow
        - content.action.edit
        - content.action.view
        - content.code.copy
    # AstraLabs is dark only: carbon ground, colours set in extra.css
    palette:
        scheme: slate
        primary: custom
        accent: custom

plugins:
    - social:
        cards_layout_options:
            background_color: "#0a0909"
            color: "#ede6e1"
            font_family: Archivo
    - search
    - glightbox

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.tabbed:
        alternate_style: true 

extra_css:
    - assets/stylesheets/extra.css

extra:
    generator: false
